pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'authme-fabric'
include 'authme-core'
include 'authme-fabric'
include 'authme-fabric-mid'
include 'authme-fabric-legacy'
// Legacy local-only variants: include them only when present in the working tree.
['authme-fabric-old', 'authme-fabric-pre', 'authme-fabric-older'].each { dir ->
    if (file(dir).exists()) {
        include dir
    }
}
