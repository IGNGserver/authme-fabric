  authme.admin.converter:
    default: op
  authme.admin.switchantibot:
    default: op
  authme.admin.updatemessages:
    default: op
  authme.admin.seerecent:
    default: op
  authme.admin.purge:
    default: op
  authme.admin.backup:
    default: op
  authme.admin.changemail:
    default: op
  authme.admin.getemail:
    default: op
  authme.admin.totpviewstatus:
