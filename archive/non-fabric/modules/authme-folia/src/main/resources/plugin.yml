name: AuthMe
version: 6.0.1-fabric.2-SNAPSHOT
main: io.github.authme.platform.folia.AuthMeFoliaPlugin
api-version: '1.21'
folia-supported: true
author: AuthMe
description: AuthMe account authentication for Folia servers
softdepend: [Citizens, CombatTag, CombatTagPlus, PlaceholderAPI, LuckPerms]
commands:
  authme:
    description: AuthMe administration and version command
    usage: /authme <reload|version>
  login:
    description: Log into your AuthMe account
    aliases: [l, log]
  register:
    description: Register an AuthMe account
    aliases: [reg]
  logout:
    description: Log out of your AuthMe account
  unregister:
    description: Remove your AuthMe account
    aliases: [unreg]
  changepassword:
    description: Change your AuthMe password
    aliases: [changepass, cp]
  2fa:
    description: Verify or manage two-factor authentication
    aliases: [totp]
  captcha:
    description: Complete the login CAPTCHA
  verification:
    description: Confirm an AuthMe email verification code
  email:
    description: Manage or recover an AuthMe email address
  premium:
    description: Enable verified Premium identity for this account
  freemium:
    description: Disable Premium identity for this account
permissions:
  authme.admin:
    default: op
    children:
      authme.admin.*: true
  authme.admin.*:
    default: op
    children:
      authme.admin.accounts: true
      authme.admin.antibotmessages: true
      authme.admin.backup: true
      authme.admin.changemail: true
      authme.admin.changepassword: true
      authme.admin.converter: true
      authme.admin.firstspawn: true
      authme.admin.forcelogin: true
      authme.admin.getemail: true
      authme.admin.getip: true
      authme.admin.lastlogin: true
      authme.admin.purge: true
      authme.admin.purgebannedplayers: true
      authme.admin.purgelastpos: true
      authme.admin.purgeplayer: true
      authme.admin.register: true
      authme.admin.reload: true
      authme.admin.seeotheraccounts: true
      authme.admin.seerecent: true
      authme.admin.setfirstspawn: true
      authme.admin.setfreemium: true
      authme.admin.setpremium: true
      authme.admin.setspawn: true
      authme.admin.spawn: true
      authme.admin.switchantibot: true
      authme.admin.totpdisable: true
      authme.admin.totpviewstatus: true
      authme.admin.unregister: true
      authme.admin.updatemessages: true
  authme.admin.reload:
    default: op
  authme.admin.register:
    default: op
  authme.admin.unregister:
    default: op
  authme.admin.changepassword:
    default: op
  authme.admin.forcelogin:
    default: op
  authme.admin.lastlogin:
    default: op
  authme.admin.getip:
