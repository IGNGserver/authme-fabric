plugins {
    id 'java-library'
}

base {
    archivesName = 'authme-platform-core'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = 'UTF-8'
}

dependencies {
    api project(':authme-core')
    implementation "org.xerial:sqlite-jdbc:${rootProject.sqlite_version}"
    implementation "com.mysql:mysql-connector-j:${rootProject.mysql_version}"
    implementation "org.mariadb.jdbc:mariadb-java-client:${rootProject.mariadb_version}"
    implementation "org.postgresql:postgresql:${rootProject.postgresql_version}"
}

tasks.register('platformCoreSelfTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.authme.platform.PlatformCoreSelfTest'
}

tasks.named('check') {
    dependsOn tasks.named('platformCoreSelfTest')
}

tasks.withType(Test).configureEach {
    failOnNoDiscoveredTests = false
}

jar {
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/*.MF'
    from(rootProject.file('LICENSE')) {
        rename { "${it}_authme-platform-core" }
    }
}
