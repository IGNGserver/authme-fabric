plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'java'
}

// Legacy coverage: pinned to Minecraft 1.20.4 (Java 17, ResourceLocation + hasPermission(int)).
// Reliable runtime coverage is 1.19.4 through 1.20.4; 1.16.5 through 1.19.3 has more drastic
// API surface drift (the pre-1.19 chat/Text API in particular) and is tracked as a follow-up
// additional legacy module.
base {
    archivesName = 'authme-fabric-legacy'
}

loom {
    mods {
        "authme" {
            sourceSet sourceSets.main
        }
    }
}

ext {
    legacyMinecraft = '1.20.4'
    legacyLoader    = '0.19.3'
    legacyFabricApi = '0.97.3+1.20.4'
}

dependencies {
    minecraft "com.mojang:minecraft:${project.legacyMinecraft}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.legacyLoader}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.legacyFabricApi}"

    implementation project(':authme-core')
    include      project(':authme-core')

    implementation "com.mysql:mysql-connector-j:${project.mysql_version}"
    include      "com.mysql:mysql-connector-j:${project.mysql_version}"

    implementation "org.mariadb.jdbc:mariadb-java-client:${project.mariadb_version}"
    include      "org.mariadb.jdbc:mariadb-java-client:${project.mariadb_version}"

    implementation "org.postgresql:postgresql:${project.postgresql_version}"
    include      "org.postgresql:postgresql:${project.postgresql_version}"

    implementation "org.bouncycastle:bcprov-jdk18on:${project.bouncycastle_version}"
    include      "org.bouncycastle:bcprov-jdk18on:${project.bouncycastle_version}"

    implementation "org.xerial:sqlite-jdbc:${project.sqlite_version}"
    include      "org.xerial:sqlite-jdbc:${project.sqlite_version}"

    implementation "org.yaml:snakeyaml:${project.snakeyaml_version}"
    include      "org.yaml:snakeyaml:${project.snakeyaml_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_authme-fabric-legacy" }
    }
}